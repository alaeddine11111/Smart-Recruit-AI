server:
  port: 8081

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smartrecruit_auth}
      auto-index-creation: true

app:
  jwt:
    # Base64, at least 256 bits. DEV ONLY: override with the JWT_SECRET env variable outside local work.
    secret: ${JWT_SECRET:85ZcnqJvaih2oDxHpJX6eug/UyniFgZKuf8v6BSVuk80e+p5xZNM0CszbJQCZ913}
    expiration-ms: 86400000
  admin:
    # Seeded once if no admin exists. DEV ONLY: override with env variables.
    email: ${ADMIN_EMAIL:admin@smartrecruit.tn}
    password: ${ADMIN_PASSWORD:Admin@12345}
  cors:
    allowed-origins: http://localhost:4200
  keycloak:
    # Keycloak is only used by the mobile app. Disabled by default: the web flow is unchanged.
    enabled: ${KEYCLOAK_ENABLED:false}
    server-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:smartrecruit}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:smartrecruit-backend}
    # Never commit the secret: set the KEYCLOAK_ADMIN_CLIENT_SECRET environment variable.
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    # Simplest for development: the Keycloak master admin (admin-cli). Set the password only in your terminal.
    admin-username: ${KEYCLOAK_ADMIN_USER:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:}
  offer-service-url: ${OFFER_SERVICE_URL:http://localhost:8084}
